"Know What Sets It Apart",body:"Valuable factory options and packages often go unnoticed. Enter your VIN to uncover the original window sticker and verified build sheet — revealing exact equipment packages, options codes, and original MSRP. Know its full worth before you price, list, or negotiate.",badges:["Factory-Verified Data","Instant Delivery","PDF & Web Format","Any Make or Model"]},fr={kicker:"What You'll Find on Every Window Sticker",title:"Discover Your Vehicle's Original Factory Build",body:"Every vehicle leaves the factory with a unique combination of equipment. A window sticker reveals exactly what your vehicle was built with, helping you understand its true original configuration.",items:[{title:"Original Equipment & Specifications",body:"Confirm your engine type, transmission, drivetrain, and standard equipment. Documenting these details helps you build a highly accurate description for your listing."},{title:"Factory Options & Packages",body:"Did your vehicle come with a premium technology package, sport suspension, or upgraded interior? Uncovering these factory options helps you identify valuable features that make your vehicle stand out."},{title:"Original MSRP",body:"See what the vehicle cost when it was brand new, including itemized pricing for optional equipment. This provides valuable context when deciding how to position your current asking price."},{title:"Original Specifications",body:"Review the official factory specifications, including exterior paint codes, interior trim details, and specific technical measurements as they were originally recorded."},{title:"Fuel & Efficiency Ratings",body:"Access the original EPA ratings for city, highway, and combined MPG. This information is often requested and having the official numbers documented adds credibility to your listing."},{title:"Safety & Warranty Details",body:"Check original safety ratings and manufacturer warranty terms. If your vehicle still falls within transferable coverage periods, this is crucial information to know before you sell."}]},Rs={kicker:"Sample Build Documentation",title:"See the Information You Could Uncover",body:"Click any vehicle below to view a sample window sticker. See exactly what kind of original factory information you can discover about your own vehicle.",cta:"View Window Sticker",vehicles:[{name:"2017 Audi S6",image:vu+"Thumbnail-1.webp",vin:"WAUFFAFC5HN007408",msrp:"$70,900",exterior:"Brilliant Black",interior:"Black w/Valcona Leather Seating Surfaces",href:`${jt}/sticker/vin/WAUFFAFC5HN007408-E323E323-C5C5-4A45-31B5-C95F9EB7CBEC`},{name:"2020 Ford F-150",image:vu+"Thumbnail-2.webp",vin:"1FTFW1RG6LFA12962",msrp:"$56,440",exterior:"Agate Black Metallic",interior:"Blue Accent w/Recaro Unique Leather Insert",href:`${jt}/sticker/vin/1FTFW1RG6LFA12962-A839A839-4848-4C2A-64E7-90517C0A1DC1`},{name:"2022 Mercedes-Benz GLA 250",image:vu+"Thumbnail-3.webp",vin:"W1N4N4HB1NJ342468",msrp:"$38,400",exterior:"Digital White Metallic",interior:"Titanium Gray/Black w/Leather Upholstery",href:`${jt}/sticker/vin/W1N4N4HB1NJ342468-8F748F74-6D6D-2406-1E54-BD17CA2AD529`}]},hr={kicker:"Classic & Older Vehicle Documentation",title:"Don't Leave Value on the Table",body:"For older, enthusiast, and highly-optioned vehicles, original build information can be incredibly difficult to find. Many sellers list their vehicles without knowing exactly what factory equipment is installed, potentially leaving money on the table. A window sticker helps you confirm your vehicle's original configuration so you can price and present it accurately.",quote:"“You can't effectively price a vehicle if you don't know exactly what it was built with. Documentation is the key to understanding its true value.”"},mr={kicker:"For Vehicle Sellers",title:"Why Invest in Your Vehicle's Documentation?",body:"The more you know about your vehicle, the better prepared you are to present its value.",items:[{title:"Discover What You Own",body:"You might be surprised by what your vehicle was originally equipped with. Uncover factory options, special packages, and specific trim details you may not have been aware of."},{title:"Price with Confidence",body:"When you understand exactly what your vehicle cost new and what options it includes, you have better information when deciding how to position your asking price in the current market."},{title:"Create a Better Listing",body:"Move beyond a generic description. Use the exact factory terminology, package names, and specifications to write a detailed, compelling listing that attracts serious interest."},{title:"Document the Details",body:"Have the original specifications in hand. Instead of guessing about engine codes or paint colors, you'll have the documented facts about your vehicle's factory configuration."},{title:"Present a Complete Story",body:"A window sticker provides the foundation of your vehicle's history. By showing what it was from day one, you create a more professional and thorough presentation of your investment."},{title:"Understand What Sets Your Build Apart",body:"Every factory build has distinct options and configurations. Uncover the exact specification package that makes your car unique before it changes hands."}]},Ke={kicker:"Clear & Transparent Pricing",title:"Vehicle Documentation Packages",body:"Choose the package that best fits your needs. Purchase credits that never expire and pull documentation whenever you need it.",tabStickers:"Window Stickers",tabReports:"Vehicle History",stickers:O1,reports:Vs,notes:[{title:"Credits Never Expire",body:"Purchase now and use your credits whenever you're ready to sell."},{title:"Instant PDF & Web Delivery",body:"Generate your window sticker or vehicle history report in seconds, ready to share with buyers."},{title:"NMVTIS & DMV Certified",body:"Direct access to official federal databases, state DMVs, and factory databases."}],faq:{kicker:"Got Questions?",title:"Frequently Asked Questions",body:"Everything you need to know about our vehicle reports and billing.",items:[{q:"Do purchased vehicle report credits expire?",a:`No! All credits purchased on ${z} never expire. You can buy a 2-pack or 5-pack today and use them whenever you find a car you want to inspect.`},{q:"What is the difference between a Vehicle History Report and a Window Sticker?",a:"A Vehicle History Report provides title brands, ownership timeline, collision history, and odometer readings. A Window Sticker reproduces the original factory Monroney label showing every standard option, package code, MSRP invoice, and EPA fuel ratings as the vehicle left the factory."},{q:`How does ${z} obtain original factory specs?`,a:"We decode manufacturer build databases, NMVTIS federal registries, state DMV records, and official OEM build sheets to reconstitute complete factory equipment and pricing."},{q:"Can I print or save my reports as a PDF?",a:"Yes, every generated report and Monroney window sticker includes a direct one-click PDF export and full color print layout formatted specifically for standard letter size paper."},{q:"What if my VIN has no data?",a:"In the rare event that a VIN cannot be decoded by our database, our 24/7 customer support will either manually research the archives for your vehicle or issue an immediate replacement credit."}]}},Su={title:"What Was Your Vehicle Built With?",body:"Enter your VIN to uncover its original factory window sticker.",cta:"Look Up Your Window Sticker"},$e={eyebrow:"Vehicle History Report",eyebrow2:"Ownership, Title & Mileage Records",title:"Know Your Vehicle's Full Story Before You Sell",body:"Before you decide what your vehicle is worth and how you want to present it, you should know as much as possible about it. A vehicle history report gathers ownership records, title status, mileage verification, and more — so you're working with the full picture, not assumptions.",docKicker:"Vehicle History Documentation",docTitle:"What Can You Learn About Your Vehicle?",docBody:"A vehicle history report pulls together ownership records, title status, mileage verification, and more. This is the information you should review before deciding how to position and price your vehicle.",counterOf:"of 9",tabs:[{label:"Auction Records",name:"Auction Documentation",badge:"10 Photos",title:"Auction Records with Photos",body:"If your vehicle has been through an auction at any point, this section documents that history. Knowing this upfront helps you understand how the vehicle was previously valued and what condition it was in at that time.",points:["Auction condition grade and final bid amounts","Key availability and engine start status at time of auction","Title type and any noted damage at time of sale","Auction location and seller classification (insurance, dealer, or private)","Up to 10 vehicle photos from the auction, when available"]},{label:"Sales Listing",name:"Listing History",badge:"With Photos",title:"Historical Sales Listings",body:"Review historical dealership and private seller listings. This helps track the vehicle's asking price over time and allows you to compare past listing descriptions with its current condition.",points:["Historical asking prices and dealership information","Dates and locations of previous listings","Mileage recorded at the time of each listing","Photos and descriptions from past sales"]},{label:"Vehicle Usage",name:"Usage Documentation",badge:"Fleet/Personal",title:"Documented Vehicle Usage",body:"Understand how the vehicle was primarily used by previous owners. Knowing if a vehicle was used for personal commuting, fleet operations, or as a rental can significantly impact its overall value and expected wear.",points:["Personal, corporate fleet, or rental usage designation","Taxi, police, or emergency vehicle history","Commercial or lease usage records"]},{label:"Ownership History",name:"Ownership Records",badge:"Tenure & State",title:"Detailed Ownership Records",body:"A complete timeline of the vehicle's past owners. Tracking the number of owners, the duration they held the vehicle, and the states where it was registered provides crucial context for its maintenance history.",points:["Total number of previous owners","Duration of ownership for each period","States and regions where the vehicle was registered","Estimated miles driven by each owner"]},{label:"Title Status",name:"Title Verification",badge:"60+ Checks",title:"Comprehensive Title Verification",body:"We check the vehicle's title against 60+ historical brands. A clean title is essential for ensuring the vehicle can be legally sold, registered, and insured without complications.",points:["Salvage, rebuilt, or junk title checks","Flood, hail, and fire damage title brands","Lemon law buybacks and manufacturer recalls","Verification across 50-state DMV databases"]},{label:"Accident Records",name:"Collision Records",badge:"Date & Place",title:"Reported Collision Records",body:"Review all reported accidents, damage, and collision events. This section helps you identify past structural repairs or airbag deployments that might not be visible during a standard inspection.",points:["Dates and locations of reported accidents","Severity of damage and points of impact","Airbag deployment records","Structural damage and repair estimates"]},{label:"Theft Records",name:"Theft Verification",badge:"Theft Check",title:"Theft & Recovery Verification",body:"Ensure the vehicle has not been reported stolen or has a documented theft recovery history. A clear theft record protects you from potential legal issues and insurance complications.",points:["Active theft reports and police records","Theft recovery dates and condition at recovery","Verification against NICB and federal databases"]},{label:"Odometer Check",name:"Mileage Verification",badge:"Mileage Verified",title:"Verified Mileage Records",body:"Verify the accuracy of the vehicle's odometer readings over time. Documented mileage entries help protect against odometer rollback fraud and confirm the true wear on the vehicle.",points:["Chronological mileage readings from service and registration","Odometer rollback and discrepancy checks","Exceeds mechanical limits title brands","Average miles driven per year"]},{label:"Loan & Lien",name:"Financial Status",badge:"Lender Check",title:"Open Loan & Lien Checks",body:"Verify whether there are any open loans or liens against the vehicle. Selling or buying a vehicle with an active lien requires additional steps to clear the title transfer.",points:["Current open liens and financial encumbrances","Historical loan records and payoffs","Impound or mechanic's lien checks"]}],buildKicker:"More Than Just a History Check",buildTitle:"Build a Complete Understanding of Your Vehicle",buildBody:"Our reports pull from state DMV records, federal databases, manufacturer data, and auction archives. The result is a consolidated view of your vehicle's background — so you're making decisions based on documented information, not guesswork.",buildItems:[{title:"Vehicle Specifications",body:"Body style, engine, fuel type, transmission, and factory-installed options. Understand the full technical profile of your vehicle so you can describe it accurately and completely."},{title:"Title Verification",body:"Verified against state DMV, federal, insurance, and auction databases. Knowing your vehicle's title status is essential before you begin pricing or negotiating."},{title:"Accident & Damage Records",body:"Checked against damage and collision databases in the United States and Canada. Knowing what's on record helps you understand the vehicle's condition history and factor it into your pricing."},{title:"Market Value Data",body:"See how similar vehicles are priced across listing sites in North America. This helps you understand where your vehicle sits in the market and make a more informed pricing decision."},{title:"Odometer Records",body:"All available mileage records from state DMVs, inspections, and service databases. Confirming your vehicle's mileage is consistent and documented gives you confidence when discussing it."},{title:"Ownership & Service Records",body:"Number of previous owners, ownership duration, and available service records in chronological order. Understanding how the vehicle has been cared for over time adds depth to your knowledge of it."}],stickerKicker:"Original Factory Build Data",stickerTitle:"Complete the Picture with a Window Sticker",stickerBody:"A vehicle history report tells you what happened over time. A window sticker tells you what the vehicle was from day one — its original factory configuration, options, MSRP, EPA ratings, and warranty terms. Together, they give you a complete understanding of the vehicle you're selling. For older and enthusiast vehicles, this original build information can be especially difficult to find on your own.",stickerCta:"Get Your Window Sticker"},rn={kicker:"Verified Customer Reviews",title:"What Our Customers Say",body:`Sellers, collectors, dealership managers, and individual owners who used ${z} to document their vehicles and present them with confidence.`,rating:"4.8",basedOn:"Based on 150+ reviews",verified:"Verified Review",verifiedShort:"Verified",items:[{quote:"“This vehicle history report has everything I needed to entice a buyer. I am trying to sell my vehicle and it is a great alternative to Carfax at a much better rate. Provided complete transparency.”",name:"Keith Williams",checked:"Checked: 2016 Ford F-150"},{quote:"“I got a window sticker for my vehicle and was surprised at how accurate it was and how quickly it was delivered! It was helpful when I sold my vehicle because the buyer wanted to see the exact original packages.”",name:"Bobby Hedrick",checked:"Checked: 2019 GMC Sierra 1500"},{quote:"“Helpful affordable service that offers accurate information about your vehicle. I would choose this over any other vehicle history services. The report flagged prior structural repairs that the seller failed to mention.”",name:"Mike Ericson",checked
